name: Release

# Local-first release (mirrors the joy subproject / ADR-032): `just publish`
# runs `joy release publish`, which pushes the commits and the vX.Y.Z tag. That
# tag push triggers this workflow, which builds the VSIX, creates or updates the
# GitHub release, and uploads to the VS Code Marketplace and Open VSX.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Present only when the Open VSX upload is configured. The ovsx step self-skips
  # while this is empty, so Open VSX stays optional.
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=package/joy-vscode-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Lint, typecheck, unit tests
        run: npm run check

      - name: Bundle extension
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Compute checksums
        working-directory: package
        run: sha256sum "joy-vscode-${{ steps.version.outputs.version }}.vsix" > SHA256SUMS

      - name: Prepare release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Install from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=joyint.joy-vscode) (search "Joy"), or download the VSIX below.

          **From VSIX (UI)**: open the Command Palette and run `Extensions: Install from VSIX...`, then pick the downloaded file.

          **From VSIX (CLI)**: `code --install-extension joy-vscode-__VERSION__.vsix`

          Requires the [joy CLI](https://github.com/joyint/joy) on PATH (auto-discovered via login shell and common install locations; configurable via the `joy.executablePath` setting).

          Verify the download with `sha256sum -c SHA256SUMS`.
          EOF
          sed -i "s/__VERSION__/${{ steps.version.outputs.version }}/g" "$RUNNER_TEMP/notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VSIX: ${{ steps.version.outputs.vsix }}
          PRERELEASE_FLAG: ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading artifacts to it."
            gh release upload "$TAG" "$VSIX" package/SHA256SUMS --clobber
          else
            echo "Release $TAG does not exist; creating it."
            gh release create "$TAG" $PRERELEASE_FLAG "$VSIX" package/SHA256SUMS \
              --title "v${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # Stable tags (vX.Y.Z) publish to the registries; pre-release tags
      # (vX.Y.Z-rc1, etc.) only produce a GitHub release with the attached VSIX.
      - name: Publish to VS Code Marketplace
        if: ${{ steps.version.outputs.prerelease == 'false' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX
        if: ${{ steps.version.outputs.prerelease == 'false' && env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish "${{ steps.version.outputs.vsix }}" -p "$OVSX_PAT"
