description: 'Build a Visual Studio Code extension that wraps the joy CLI for product management work directly inside the editor. Scope: a tree view panel listing items with sorting and nesting, a webview form editor for create and edit, a status bar session indicator with passphrase re-prompt on expiry, and Marketplace plus Open VSX publishing. The extension expects the joy binary to be installed on the system (with an optional override path in settings) and enforces a minimum version. Out of scope: AI agent panel integration is tracked separately.'
