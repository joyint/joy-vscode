- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-16T02:07:04.188097642Z
  text: |-
    Plan (third increment): A+B UX so the auto-detected path is visible and easy to override.

    A) Status bar in the ok branch
    - Show $(check) Joy CLI <version> (currently hidden when ok)
    - Tooltip is a trusted MarkdownString with the full executable path plus a command link to the configure flow
    - Click target switches from undefined (no action) to joy.configureExecutablePath

    B) Dedicated configure command
    - New command joy.configureExecutablePath registered in package.json
    - Opens vscode.window.showInputBox with:
      - value = current joy.executablePath setting (empty if unset)
      - placeHolder = '<auto-detected-path> (auto-detected)' when last resolution succeeded, or 'Absolute path to joy' otherwise
      - prompt explaining auto-resolve fallback
      - ignoreFocusOut: true
    - On submit: trims input, writes joy.executablePath to ConfigurationTarget.Global (binary paths are per-machine, not per-workspace, so global avoids the portability footgun that auto-writing to workspace would cause)
    - After write, performResolve() runs again so the status bar reflects the new state
    - On Esc (input === undefined): no change

    joy.executablePath gets a markdownDescription with a [Configure...](command:joy.configureExecutablePath) link so the configure dialog is reachable directly from Settings UI.

    Tests: 1 new integration test for joy.configureExecutablePath registration. The InputBox flow itself is not unit-testable without complex VS Code API mocking; the logic that prepares the placeholder string (auto-detected vs none) can be exercised through the integration test by inspecting the registered command exists.
