description: Open an item in a webview-based form editor with fields for title, type, priority, effort, status, description, tags, milestone, dependencies, and assignment. Save writes back via joy edit; new-item form writes via joy add. Validation matches the CLI constraints (title length, allowed values). The form opens via TreeView double-click or command palette.
