  text: 'Plan: WebviewView joyItemDetail in the joy container (draggable to the secondary sidebar), modeled on the app ItemDetail: inline title edit, status verb buttons per current status, dropdowns for type, priority, effort, milestone, markdown description editor, comment list with add box. All writes via joy CLI (edit, status verbs, comment, milestone link). Tree click selects into the detail view; the raw markdown show stays as context menu entry.'
