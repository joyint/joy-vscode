description: Add a status bar item (VS Code footer) showing the current Joy member identity and remaining session time, with color/icon for authenticated, expiring-soon, and unauthenticated states. Clicking it opens a graphical passphrase InputBox; on success the extension runs joy auth and refreshes. When a joy command fails with a session-expired error, the same InputBox appears automatically before retrying the command. Depends on the joy-cli --passphrase-stdin flag (tracked separately in the joy repo) so the passphrase never appears in process listings.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-07-08T18:20:08.814576888Z
  text: 'Requirements from operator: on the first write that demands auth, show a modal passphrase prompt (VS Code InputBox with password masking, an eye button to toggle reveal, inline validation error on wrong passphrase, stays open for retry). Redeemed session is kept in SecretStorage and passed via --session or JOY_SESSION to subsequent CLI calls. Status bar shows auth state compactly; all joy status bar items must stay short and non-dominant.'
