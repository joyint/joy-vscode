description: |-
  Make the extension installable for early testers before any marketplace publishing.

  GitHub Actions workflow that runs `vsce package` on tagged commits and attaches the produced `.vsix` to the GitHub Release. Versioning follows semantic versioning aligned with `joy release` (format `v0.0.0`). README gets an 'Install (preview)' section explaining the two installation paths:

  - VS Code UI: Command Palette -> 'Extensions: Install from VSIX...'
  - CLI: `code --install-extension joy-vscode-X.Y.Z.vsix`

  Scope is intentionally minimal: no publisher account, no marketplace metadata, no signing - just an installable VSIX asset on every tagged release so a small group of testers can try the extension and report back. Full marketplace + Open VSX publishing remains tracked under JVSC-0006-79.
