  text: |-
    Plan: one commit, two artifacts (workflow + rewritten root README), no marketplace touchpoints.

    Workflow (.github/workflows/release.yml)
    - Triggers on tag push matching 'v*'
    - Single ubuntu-latest job; node 20 with npm cache
    - Steps: checkout -> npm ci -> derive VERSION from GITHUB_REF_NAME (strip 'v') -> npm version --no-git-tag-version --allow-same-version -> npm run check (typecheck + lint + format + unit tests) -> npm run build -> npx --yes @vscode/vsce package --no-dependencies -> gh release create with the .vsix attached
    - VSIX file name pattern is vsce default: joy-vscode-<version>.vsix
    - Release notes embed the two install paths (code --install-extension + Command Palette flow)
    - Permissions: contents:write so GITHUB_TOKEN can create the release
    - Integration tests are deliberately NOT run on the release pipeline; they belong to a per-push CI workflow that JVSC-0006-79 will set up. Release just ships the bundle that 'check' already validated.

    package.json
    - Add @vscode/vsce as devDep so 'npx vsce' is deterministic across runs
    - Add 'package' script: 'vsce package --no-dependencies'

    justfile
    - 'just package' calls 'npm run package'

    Root README (user-facing rewrite)
    - Tagline + one-line summary
    - Install (preview): a 'Latest release' link to GitHub Releases, instructions for the two install paths (code --install-extension and 'Extensions: Install from VSIX...')
    - Requirements: joy CLI, with a link to https://github.com/joyint/joy
    - Features (bullet list mirroring joy/README.md style: backlog tree, lifecycle actions, auto-discovery, etc.)
    - Documentation pointer (vision/architecture for users curious about scope)
    - Status: pre-release
    - License

    CONTRIBUTING.md
    - Move the 'Develop locally' block (just install/check/build/F5) here under a new 'Development setup' section, plus a one-liner about 'just package' building a local .vsix

    Cross-platform: VSIX is platform-agnostic JS bundle; both install paths (code CLI + Command Palette) work on Linux/macOS/Windows. Workflow runs on linux only because the artifact doesn't depend on the runner platform.

    Joy release flow integration note: joy-vscode's .joy/project.yaml currently does not declare version-files, so 'joy release bump' won't touch package.json. The workflow derives version from the git tag, sidestepping that. Configuring version-files belongs to a future bookkeeping task.
