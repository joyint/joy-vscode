description: |-
  All platform-specific behavior in joy-vscode must work on Linux, macOS, and Windows. When designing anything that touches the OS - shell invocations, file paths, executable extensions, environment variable lookups, install locations - cover all three platforms from the start. Do not Linux-first and patch later.

  Concrete implications:
  - Shell lookups respect process.env.SHELL on Unix; on Windows, use where.exe or skip if not applicable.
  - File paths go through node:path (with posix / win32 variants when generating per-platform lists) and os.homedir(); no hardcoded '/' or '~/'.
  - Executable names append .exe on Windows.
  - Common install locations are maintained as two lists: Unix (~/.local/bin, /usr/local/bin, /opt/homebrew/bin, ~/go/bin, ~/.cargo/bin) and Windows (%USERPROFILE%\.local\bin, %LOCALAPPDATA%\Programs, %USERPROFILE%\go\bin, %USERPROFILE%\.cargo\bin, %PROGRAMFILES%\joy).
  - Tests cover at least one representative branch per platform when behavior is platform-conditional.

  This applies to every story and task in the project unless a specific item explicitly narrows scope (e.g. a 'Linux-only quality-of-life feature' would need to call that out and justify it).
