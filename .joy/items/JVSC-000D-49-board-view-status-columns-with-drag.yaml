  text: 'Plan: singleton WebviewPanel (joy.openBoard) with columns New (new+open), In progress, Review, Done (closed); deferred stays off the board like in the app. Card drop triggers the column verb (reopen/start/submit/close), double click opens the item detail view. Header: instant text filter on id and title, sort select (created, updated, id, title, effort, priority, type) with asc/desc toggle, applied within columns. Data via joy ls --all; refresh on .joy/items watcher and after every action.'
