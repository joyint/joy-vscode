description: Start work on an item creates a branch named after the item id plus short title, runs joy start, and assigns the user. The status bar shows the current item derived from the branch name. The SCM commit input gets the item id appended automatically so the commit-msg hook always passes. Modeled on Jira's Start work and Linear's branch-name convention.
