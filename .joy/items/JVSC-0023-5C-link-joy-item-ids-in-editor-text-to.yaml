description: Detect Joy item IDs (ACRONYM-XXXX or ACRONYM-XXXX-YY) in editor documents (code, markdown, plaintext, commit messages) via a DocumentLinkProvider and link them to a command that opens the item detail webview (joy.openDetail). Resolve short refs to the full id and only link ids that exist in the loaded backlog to avoid dead links. Optional hover showing title/status.
