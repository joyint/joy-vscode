description: 'Add a ''Joy: Add AI Delegation Token'' command: pick one of the current user''s delegated AI members (auth status --json -> delegated_sessions[].member), prompt for the passphrase, run joy auth token add <member> --passphrase-stdin --json, parse data.token, copy it to the clipboard so the operator can paste it to the AI (which redeems with joy auth --token <token> --json). Offer a ''Copy redeem command'' action.'
