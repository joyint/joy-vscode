description: 'Wird ein Item in der Sidebar bearbeitet, lädt das Board neu (nötig, weil das Item die Spalte wechseln kann). Dabei springen alle Spalten wieder an den Anfang. In längeren Listen geht damit der Kontext verloren: das nächste Item, das man bearbeiten wollte, muss man erneut heruntersuchen. Gewünscht ist, dass die Scrollposition je Spalte den Refresh übersteht. Komfortthema, von Horst ausdrücklich als nicht entscheidend eingestuft.'
