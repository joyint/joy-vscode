description: 'When an item is edited in the sidebar, the board reloads, which is necessary because the item may change column. All columns jump back to the top in the process. In longer lists that loses the context: the next item one wanted to edit has to be searched for again. Wanted: the scroll position per column survives the refresh. A comfort matter, which Horst explicitly called not decisive.'
