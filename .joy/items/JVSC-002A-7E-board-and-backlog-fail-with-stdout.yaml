description: 'Customers see "stdout maxBuffer length exceeded" on the board and an empty backlog. The plugin reads joy through Node execFile, whose default buffer is 1 MiB; joy --json ls --all carries every item with description and comments and is larger in a long-lived project (JAPP: 1.43 MB for 863 items, 73 % comments and descriptions). Fix: no cap on what joy prints (joyClient.ts). Repro: unit test with 3 MB of stdout, e2e/board.spec.ts with a project whose ls is over 1 MiB; both red without the fix. A slimmer joy ls (no comments) is a separate joy question.'
